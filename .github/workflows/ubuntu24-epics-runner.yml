---
name: Ubuntu 24.04 EPICS runner

"on":
  push:
    branches: [master]
    paths:
      - "ubuntu24-epics-runner/**"
      - "ubuntu24/**"
      - "gate.bash"
      - "configure/VERSIONS"
      - "docker_builder.bash"
      - ".trigger/**"
      - ".github/workflows/ubuntu24-epics-runner.yml"
      - ".github/workflows/image.yml"
  pull_request:
    branches: [master]
    paths:
      - "ubuntu24-epics-runner/**"
      - "ubuntu24/**"
      - "gate.bash"
      - "configure/VERSIONS"
      - "docker_builder.bash"
      - ".github/workflows/ubuntu24-epics-runner.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu24-epics-runner:
    uses: ./.github/workflows/image.yml
    with:
      image_dir: ubuntu24-epics-runner
      image_name: jeonghanlee/ubuntu24-epics-runner
      is_runner: true
      base_dir: ubuntu24
