---
name: Rocky Linux 8 EPICS slim

"on":
  push:
    branches: [master]
    paths:
      - "rocky8-epics-slim/**"
      - "gate.bash"
      - ".trigger/**"
      - ".github/workflows/rocky8-epics-slim.yml"
      - ".github/workflows/image.yml"
  pull_request:
    branches: [master]
    paths:
      - "rocky8-epics-slim/**"
      - "gate.bash"
      - ".github/workflows/rocky8-epics-slim.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rocky8-epics-slim:
    uses: ./.github/workflows/image.yml
    with:
      image_dir: rocky8-epics-slim
      image_name: jeonghanlee/rocky8-epics-slim
      is_runner: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
