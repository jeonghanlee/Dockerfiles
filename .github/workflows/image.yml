---
name: EPICS image (reusable)

# Reusable build-gate-publish workflow for the distribution-based EPICS images.
# Callers are the thin per-OS workflows.
# Flow: build and LOAD the image into the runner daemon, run the container
# verification gate (gate.bash) against it, and publish only on a manual
# workflow_dispatch on master after the gate passes -- a master merge never
# auto-publishes, because publish authorization stays with the owner.

"on":
  workflow_call:
    inputs:
      image_dir:
        description: "Image directory under the repository root"
        required: true
        type: string
      image_name:
        description: "Docker Hub repository name"
        required: true
        type: string
    secrets:
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-22.04
    env:
      IMAGE_DIR: ${{ inputs.image_dir }}
      IMAGE_NAME: ${{ inputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read distribution version from the Dockerfile
        id: ver
        run: |
          df="${IMAGE_DIR}/Dockerfile"
          v="$(grep -m1 -oE 'DIST_VERSION=[0-9.]+' "${df}" | cut -d= -f2)"
          test -n "${v}"
          echo "dist_version=${v}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/${{ inputs.image_dir }}
          file: ${{ github.workspace }}/${{ inputs.image_dir }}/Dockerfile
          load: true
          push: false
          tags: ${{ inputs.image_name }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_VERSION=${{ steps.ver.outputs.dist_version }}

      - name: Verification gate
        run: |
          gate="${GITHUB_WORKSPACE}/gate.bash"
          docker run --rm -v "${gate}:/gate.bash:ro" \
            "${IMAGE_NAME}:latest" bash /gate.bash

      - name: Login to Docker Hub
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Publish latest and the distribution version
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/master'
        env:
          VER: ${{ steps.ver.outputs.dist_version }}
        run: |
          docker tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${VER}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${VER}"
