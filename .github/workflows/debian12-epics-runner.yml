---
name: Debian 12 EPICS runner

"on":
  push:
    branches: [master]
    paths:
      - "debian12-epics-runner/**"
      - "gate.bash"
      - ".trigger/**"
      - ".github/workflows/debian12-epics-runner.yml"
      - ".github/workflows/image.yml"
  pull_request:
    branches: [master]
    paths:
      - "debian12-epics-runner/**"
      - "gate.bash"
      - ".github/workflows/debian12-epics-runner.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debian12-epics-runner:
    uses: ./.github/workflows/image.yml
    with:
      image_dir: debian12-epics-runner
      image_name: jeonghanlee/debian12-epics-runner
      is_runner: true
