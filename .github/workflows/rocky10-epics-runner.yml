---
name: Rocky Linux 10 EPICS runner

"on":
  push:
    branches: [master]
    paths:
      - "rocky10-epics-runner/**"
      - "gate.bash"
      - ".trigger/**"
      - ".github/workflows/rocky10-epics-runner.yml"
      - ".github/workflows/image.yml"
  pull_request:
    branches: [master]
    paths:
      - "rocky10-epics-runner/**"
      - "gate.bash"
      - ".github/workflows/rocky10-epics-runner.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rocky10-epics-runner:
    uses: ./.github/workflows/image.yml
    with:
      image_dir: rocky10-epics-runner
      image_name: jeonghanlee/rocky10-epics-runner
      is_runner: true
