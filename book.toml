[book]
title = "Dockerfiles"
description = "Docker image definitions, build flow, and maintenance procedures"
authors = ["Jeong Han Lee"]
src = "docs"
language = "en"

[build]
build-dir = "public"
create-missing = false
use-default-preprocessors = true

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
smart-punctuation = true
no-section-label = false
git-repository-url = "https://github.com/jeonghanlee/Dockerfiles"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/jeonghanlee/Dockerfiles/edit/master/{path}"
site-url = "/Dockerfiles/"

[output.html.print]
enable = true
page-break = true

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
